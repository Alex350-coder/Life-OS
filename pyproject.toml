[project]
name = "lifeos"
version = "0.1.0"
description = "Life OS: planificación personal con agentes sobre una bóveda de Obsidian."
authors = [{ name = "Alexander" }]
requires-python = ">=3.12"
# Fase 2 (ADR-0007): PyYAML y Pydantic, usados solo en `adapters` (tests/test_architecture.py).
# Fase 3: tzdata da a `zoneinfo` la base de zonas IANA en Windows (no tiene una del sistema).
# Fase 5 (ADR-0012): FastAPI y uvicorn, usados solo en la capa `web` (tests/test_architecture.py).
dependencies = [
    "fastapi>=0.162,<1",
    "pydantic>=2.9,<3",
    "pyyaml>=6.0.2,<7",
    "tzdata>=2025.2",
    "uvicorn>=0.54,<1",
]

[project.scripts]
lifeos = "lifeos.cli.main:main"
lifeos-web = "lifeos.web.server:main"

[build-system]
requires = ["uv_build>=0.11.18,<0.12.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-markers", "--import-mode=importlib", "-m", "not live"]
# Starlette 1.x recomienda httpx2 para TestClient; httpx sigue funcionando y httpx2 no se ha
# evaluado todavía (limitación registrada en la Fase 5).
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient` is deprecated"]
markers = [
    "unit: pruebas de dominio y reglas puras",
    "integration: pruebas contra una bóveda temporal en disco",
    "security: pruebas negativas de controles SEC-xx",
    "live: llamada real al proveedor; requiere NVIDIA_API_KEY y se ejecuta solo a mano",
]

[tool.coverage.run]
source = ["lifeos"]
branch = true

[tool.coverage.report]
fail_under = 80
show_missing = true
skip_covered = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF", "PTH", "T20"]
# La raya "–" es el separador de rangos horarios del formato de la bóveda (HH:MM–HH:MM) y "−"
# aparece en comentarios de cálculo de capacidad.
allowed-confusables = ["–", "−"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]
"scripts/**" = ["T20"]

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]
python_version = "3.12"
files = ["src", "tests"]

[tool.bandit]
exclude_dirs = ["tests"]

[dependency-groups]
dev = [
    "bandit>=1.9.4",
    "httpx>=0.28.1",
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.2",
    "types-pyyaml>=6.0.12.20260906",
]
