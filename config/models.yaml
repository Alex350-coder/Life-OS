# Catálogo de modelos (ADR-0007). Sin secretos: api_key_env es el NOMBRE de la variable.
# Los agentes referencian perfiles, no modelos: cambiar de modelo es editar esta línea.
schema_version: 1

proveedores:
  nvidia:
    base_url: https://integrate.api.nvidia.com/v1
    api_key_env: NVIDIA_API_KEY

perfiles:
  grande:
    proveedor: nvidia
    modelo: mistralai/mistral-large-4-1t-a52b    # confirmado 2026-11-07 con la llamada real
    timeout_s: 90
    max_tokens: 8192        # razona antes de responder; plan_v1 ocupa ~30 tokens por bloque
  ligero:
    proveedor: nvidia
    modelo: google/gemma-4-31b-it                # confirmado 2026-11-07 con la llamada real
    timeout_s: 30
    max_tokens: 1024

# Sin tarifas fechadas, el costo se registra como "desconocido" (nunca 0). El nivel gratuito
# de NVIDIA no publica una tarifa por token.
tarifas:
  fecha_tarifa: null
  modelos: {}
